<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Live Editor</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f0e8;
            --ink: #1f1b16;
            --accent: #c65a26;
            --panel: #fff8ee;
            --border: #d6cbbd;
            --shadow: 0 10px 30px rgba(31, 27, 22, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Space Grotesk", "Trebuchet MS", sans-serif;
            background: radial-gradient(circle at 20% 20%, #fff1dc 0%, transparent 55%),
                radial-gradient(circle at 80% 0%, #f9e7cf 0%, transparent 40%),
                var(--bg);
            color: var(--ink);
            min-height: 100vh;
        }

        header {
            padding: 32px 48px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        h1 {
            margin: 0;
            font-size: clamp(24px, 4vw, 40px);
            letter-spacing: 0.5px;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            border: 1px solid var(--ink);
            background: var(--ink);
            color: #fff;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button.secondary {
            background: transparent;
            color: var(--ink);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.2);
        }

        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            padding: 24px 48px 48px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            min-height: 65vh;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel h2 {
            margin: 0;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
        }

        textarea {
            flex: 1;
            width: 100%;
            border: none;
            background: transparent;
            font-family: "Fira Code", "Courier New", monospace;
            font-size: 15px;
            resize: none;
            outline: none;
            line-height: 1.6;
        }

        #preview {
            flex: 1;
            overflow: auto;
            line-height: 1.7;
        }

        #preview h1, #preview h2, #preview h3 {
            margin-top: 1.4em;
        }

        #preview pre {
            background: #231f18;
            color: #f5f0e8;
            padding: 14px;
            border-radius: 12px;
            overflow: auto;
        }

        #preview code {
            font-family: "Fira Code", "Courier New", monospace;
        }

        footer {
            padding: 0 48px 32px;
            font-size: 13px;
            color: #5f564d;
        }

        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
            },
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" defer></script>
</head>
<body>
    <header>
        <div>
            <h1>Markdown Studio</h1>
            <div>Compose Markdown with instant math rendering.</div>
        </div>
        <div class="toolbar">
            <button id="export-md">Export .md</button>
            <button class="secondary" id="export-pdf">Export PDF</button>
        </div>
    </header>

    <main>
        <section class="panel">
            <h2>Editor</h2>
            <textarea id="editor" spellcheck="false"># Live Markdown

Write markdown on the left.

Inline math: $a^2 + b^2 = c^2$

Block math:

$$
\int_0^\infty e^{-x^2} dx = \frac{\sqrt{\pi}}{2}
$$

- Lists
- Tables
- Code blocks

```python
print("Hello, markdown!")
```
            </textarea>
        </section>
        <section class="panel">
            <h2>Preview</h2>
            <div id="preview">Rendering...</div>
        </section>
    </main>

    <footer>Math rendering powered by MathJax. Export to PDF uses server-side rendering.</footer>

    <script>
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        const exportMd = document.getElementById('export-md');
        const exportPdf = document.getElementById('export-pdf');

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) {
                return parts.pop().split(';').shift();
            }
            return '';
        }

        const csrfToken = getCookie('csrftoken');

        async function renderMarkdown() {
            const formData = new FormData();
            formData.append('content', editor.value);
            const response = await fetch('/render/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrfToken,
                },
                body: formData,
            });
            const data = await response.json();
            preview.innerHTML = data.html;
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([preview]);
            }
        }

        let timeout;
        editor.addEventListener('input', () => {
            clearTimeout(timeout);
            timeout = setTimeout(renderMarkdown, 250);
        });

        async function exportFile(url, filename) {
            const formData = new FormData();
            formData.append('content', editor.value);
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrfToken,
                },
                body: formData,
            });
            const blob = await response.blob();
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.download = filename;
            link.click();
            window.URL.revokeObjectURL(link.href);
        }

        exportMd.addEventListener('click', () => exportFile('/export/md/', 'document.md'));
        exportPdf.addEventListener('click', () => exportFile('/export/pdf/', 'document.pdf'));

        renderMarkdown();
    </script>
</body>
</html>
